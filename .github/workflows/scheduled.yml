name: Scheduled Pipeline
permissions:
  contents: read

# A run must plan against the last published JSON and image state for its ref.
concurrency:
  group: outage-data-pipeline-${{ github.ref }}
  cancel-in-progress: false

on:
  # Allows manual trigger from the Actions tab and GitHub API
  workflow_dispatch:
    inputs:
      region:
        description: 'Optional: process only this region id (must match a key in REGION_SOURCES_JSON)'
        required: false
        type: string
      force_render:
        description: 'Regenerate PNGs even if their render inputs are unchanged'
        required: false
        type: boolean
        default: false

jobs:
  # Job 1: Fetch and parse HTML for all regions
  fetch-and-parse:
    name: Fetch and parse HTML
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.plan-render.outputs.regions }}
      render_at: ${{ steps.plan-render.outputs.render_at }}
      base_sha: ${{ steps.base.outputs.sha }}
      has_changes: ${{ steps.check-changes.outputs.has_changes }}
    env:
      REGION_SOURCES_JSON: ${{ secrets.REGION_SOURCES_JSON }}
      REGION: ${{ github.event.inputs.region }}
    steps:
      - name: Checkout last published snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Record base commit for downstream jobs
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Test schedule parsing and date handling
        run: npm test

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Ensure Playwright Chromium is installed
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx --yes playwright install --with-deps chromium

      - name: Test schedule rendering in Chromium
        run: npm run test:render

      - name: Fetch HTML for each region (with Playwright fallback)
        shell: bash
        run: |
          set -euo pipefail
          echo "Started at $(date -u +"%Y-%m-%dT%H:%M:%SZ") (UTC)"

          # Basic validation
          if [ -z "${REGION_SOURCES_JSON:-}" ]; then
            echo "REGION_SOURCES_JSON is empty or not set. Ensure repository secret is configured." >&2
            exit 0
          fi

          mkdir -p outputs

          # If REGION is set — pass it to the script; otherwise fetch all
          if [ -n "${REGION:-}" ]; then
            echo "[INFO] Running Playwright fetcher for region='$REGION'"
            node scripts/fetch_regions_playwright.mjs "$REGION" || true
          else
            echo "[INFO] Running Playwright fetcher for all regions"
            node scripts/fetch_regions_playwright.mjs || true
          fi

          # Always exit 0 to not fail the pipeline on partial fetch issues
          exit 0

      - name: Parse DisconSchedule.fact into JSON per region (skip failures)
        shell: bash
        run: |
          set -euo pipefail
          echo "[INFO] Parsing outputs/*.html into data/*.json via Node batch parser"
          node scripts/batch_parse.mjs

      - name: Upload fetched HTML snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-snapshots
          path: outputs/*.html
          retention-days: 7
          if-no-files-found: ignore

      - name: Check for data changes
        id: check-changes
        shell: bash
        run: |
          set -euo pipefail
          changed_files=$(git status --porcelain --untracked-files=all -- data/ | grep '\.json$' | cut -c4- || true)
          
          if [ -z "$changed_files" ]; then
            echo "[INFO] No data changes detected."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "[INFO] Detected changes in: $changed_files"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Plan regional image renders
        id: plan-render
        env:
          FORCE_RENDER: ${{ inputs.force_render }}
        run: node scripts/plan_render.mjs

      - name: Upload JSON data as artifact
        if: steps.check-changes.outputs.has_changes == 'true' || steps.plan-render.outputs.regions != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: json-data
          path: data/*.json
          retention-days: 1
          if-no-files-found: error

  # Job 2: Render only regions that have new visual inputs or missing outputs.
  render-images:
    name: Render ${{ matrix.region }}
    runs-on: ubuntu-latest
    needs: fetch-and-parse
    if: needs.fetch-and-parse.outputs.regions != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.fetch-and-parse.outputs.regions) }}
    env:
      REGION: ${{ matrix.region }}
      RENDER_KEY: ${{ matrix.key }}
      RENDER_AT: ${{ needs.fetch-and-parse.outputs.render_at }}
      RENDER_OUTPUT: rendered
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.fetch-and-parse.outputs.base_sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Ensure Playwright Chromium is installed
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx --yes playwright install --with-deps chromium

      - name: Download JSON data artifact
        uses: actions/download-artifact@v4
        with:
          name: json-data
          path: data/

      - name: Render images for ${{ matrix.region }}
        run: node scripts/batch_render.mjs --region "$REGION" --output-dir "$RENDER_OUTPUT"

      - name: Compress images with pngquant
        shell: bash
        run: |
          set -euo pipefail
          find "$RENDER_OUTPUT/$REGION" -name '*.png' -print0 | xargs -0 -P 4 -I {} npx pngquant-bin --force --ext .png --quality 65-80 --skip-if-larger "{}" || true

      - name: Verify all expected PNGs and stamp render state
        run: node scripts/plan_render.mjs --stamp

      - name: Upload images as artifact
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ matrix.region }}
          path: rendered/
          retention-days: 1
          if-no-files-found: error

  # Job 3: Publish fresh JSON even when no region renders or a render fails.
  # A region artifact exists only after its entire image set was verified.
  commit-all:
    name: Commit all changes
    runs-on: ubuntu-latest
    needs: [fetch-and-parse, render-images]
    if: >-
      !cancelled() &&
      github.ref_name == 'main' &&
      needs.fetch-and-parse.result == 'success' &&
      (needs.fetch-and-parse.outputs.has_changes == 'true' ||
       needs.fetch-and-parse.outputs.regions != '[]')
    permissions:
      contents: write
    env:
      TARGET_BRANCH: main
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.fetch-and-parse.outputs.base_sha }}
          fetch-depth: 1

      - name: Download JSON data artifact
        uses: actions/download-artifact@v4
        with:
          name: json-data
          path: data/

      - name: Download completed region artifacts
        id: download-images
        if: needs.render-images.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: images-*
          path: rendered-artifacts/
          merge-multiple: true

      - name: Apply verified image artifacts
        if: steps.download-images.outcome == 'success'
        shell: bash
        run: |
          if [[ -d rendered-artifacts ]]; then
            cp -R rendered-artifacts/. images/
          fi

      - name: Commit and push all changes
        shell: bash
        run: |
          set -euo pipefail
          echo "[INFO] Preparing to commit all changes (JSON + images) to ${TARGET_BRANCH}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "[INFO] Changed files:"
          git status --porcelain || true

          git add -- data/ images/

          if git diff --cached --quiet; then
            echo "[INFO] No changes detected — skipping commit"
            exit 0
          fi

          echo "[INFO] Staged files:"
          git diff --name-only --cached

          commit_msg="chore: update schedules and images — run #${GITHUB_RUN_ID}"
          git commit -m "$commit_msg"

          # Retry push up to 3 times
          for attempt in 1 2 3; do
            if git push origin HEAD:"$TARGET_BRANCH"; then
              echo "[OK] Pushed all updates to $TARGET_BRANCH"
              exit 0
            fi
            # Never rebase an older data/image snapshot over a newer publication.
            echo "[WARN] Push failed (attempt $attempt); retrying without rewriting history."
            sleep $((attempt*2))
          done

          echo "[ERROR] Failed to push changes after retries" >&2
          exit 1
